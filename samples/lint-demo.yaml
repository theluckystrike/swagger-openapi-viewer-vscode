openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
servers:
  - url: https://orders.example.com/
paths:
  /orders:
    get:
      summary: List orders
      tags: [orders]
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ordr'
      responses:
        '201':
          description: Created.
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one order
      description: One order by its id.
      tags: [orders]
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
          example: twelve
        status:
          type: string
          enum: [open, paid, paid]
    LegacyOrder:
      type: object
      properties:
        code:
          type: string
